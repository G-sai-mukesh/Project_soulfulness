<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Soulfulness — Coming Soon (A5)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #00BB65; --cream: #F8F3E9; --ink: #1F2420; --muted: #5E665F; --magenta: #C32991;
    --forest-soft: color-mix(in srgb, #00BB65 10%, white);
    --magenta-soft: color-mix(in srgb, #C32991 8%, white);
  }
  @page { size: 148mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Outfit", sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { position: relative; overflow: hidden; width: 148mm; height: 210mm; background: var(--cream); }
  .sheet > * { position: absolute; }
  .glow { border-radius: 50%; }
  /* full-bleed photo background, fading into cream behind the text */
  .bg { left: 0; top: 0; width: 100%; height: 138mm; object-fit: cover; object-position: 26% 78%; filter: saturate(1.12) contrast(1.04); }
  .veil { inset: 0; background:
            linear-gradient(180deg, rgba(248,243,233,.35) 0%, rgba(248,243,233,0) 12%, rgba(248,243,233,0) 44%, rgba(248,243,233,.75) 55%, var(--cream) 63%); }
  .disc { left: 50%; top: 67mm; width: 104mm; height: 104mm; translate: -50% -50%; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.30) 58%, rgba(255,255,255,0) 71%); }

  .eyebrow { left: 50%; translate: -50% 0; top: 9mm; background: rgba(255,255,255,.85); padding: 1.4mm 4mm; border-radius: 99px; white-space: nowrap; text-align: center; font-size: 7pt; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--magenta); }

  /* orbit motif from the website header: logo + service icons on rings */
  .orbit { left: 24mm; top: 17mm; width: 100mm; height: 100mm; }
  .orbit > * { position: absolute; }
  .orbit svg.rings { inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; stroke: var(--forest); stroke-width: .25; stroke-linecap: round; opacity: .6; }
  .orbit .halo { inset: 18%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--forest) 28%, transparent), transparent 70%); }
  .orbit .logo { left: 50%; top: 50%; width: 46%; translate: -50% -50%; filter: drop-shadow(0 2mm 4mm color-mix(in srgb, var(--forest) 40%, transparent)); }
  .dot { left: 50%; top: 50%; width: 8.4mm; height: 8.4mm; margin: -4.2mm 0 0 -4.2mm; border-radius: 50%;
         display: grid; place-items: center; color: #fff; background: var(--forest); border: .7mm solid #fff;
         box-shadow: 0 1mm 2.4mm rgba(31,36,32,.18);
         transform: rotate(var(--a)) translateX(43mm) rotate(calc(-1 * var(--a))); }
  .dot.m { background: var(--magenta); }
  .dot svg { width: 4.4mm; height: 4.4mm; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bfly { width: 8mm; height: 6.4mm; }

  .copy { left: 0; right: 0; top: 116mm; text-align: center; }
  .copy .pre { font-weight: 700; font-size: 15pt; letter-spacing: -.01em; }
  .copy .soon { font-family: "Dancing Script", cursive; font-weight: 700; font-size: 50pt; line-height: .95; color: var(--magenta); margin-top: 1mm; }
  .copy .tag { margin-top: 2.6mm; font-size: 8.6pt; color: var(--muted); }
  .copy .tag b { color: var(--forest); font-weight: 600; }

  .qrcard { left: 14mm; right: 14mm; top: 154mm; height: 35mm; background: #fff; border-radius: 6mm;
            box-shadow: 0 2.4mm 7mm rgba(31,36,32,.10); display: flex; align-items: center; gap: 5mm; padding: 0 4mm 0 6mm; }
  .qrcard .txt { flex: 1; }
  .qrcard .q { font-weight: 800; font-size: 12pt; line-height: 1.12; }
  .qrcard .q span { color: var(--forest); }
  .qrcard .hand { font-family: "Caveat", cursive; font-weight: 700; font-size: 14pt; color: var(--magenta); margin-top: 1.6mm; line-height: 1; display: flex; align-items: center; gap: 1.4mm; }
  .qrcard .hand svg { width: 11mm; height: 5mm; }
  /* empty QR box — paste your QR code here (30 × 30 mm) */
  .qrbox { flex: none; width: 30mm; height: 30mm; position: relative; border-radius: 2.4mm; background: #fff; }
  .qrbox i { position: absolute; width: 6mm; height: 6mm; border: .9mm solid var(--forest); }
  .qrbox i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 2.4mm; }
  .qrbox i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 2.4mm; }
  .qrbox i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 2.4mm; }
  .qrbox i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 2.4mm; }

  .foot { left: 0; right: 0; bottom: 0; height: 22mm; }
  .foot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .foot p { position: absolute; left: 0; right: 0; bottom: 6mm; text-align: center; color: #fff; font-weight: 700; font-size: 11pt; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="b" viewBox="0 0 40 32"><g fill="#fff" stroke="#C32991" stroke-width="1.2" stroke-linejoin="round"><path d="M20 16C14 3 3 2 4 11c1 7 9 7 16 5Z"/><path d="M20 16C26 3 37 2 36 11c-1 7-9 7-16 5Z"/><path d="M20 16c-5 4-11 10-8 13 3 2 6-5 8-13Z"/><path d="M20 16c5 4 11 10 8 13-3 2-6-5-8-13Z"/></g><path d="M20 10v15M20 10l-3-5M20 10l3-5" fill="none" stroke="#C32991" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="bg" viewBox="0 0 40 32"><g fill="#fff" stroke="#00BB65" stroke-width="1.2" stroke-linejoin="round"><path d="M20 16C14 3 3 2 4 11c1 7 9 7 16 5Z"/><path d="M20 16C26 3 37 2 36 11c-1 7-9 7-16 5Z"/><path d="M20 16c-5 4-11 10-8 13 3 2 6-5 8-13Z"/><path d="M20 16c5 4 11 10 8 13-3 2-6-5-8-13Z"/></g><path d="M20 10v15M20 10l-3-5M20 10l3-5" fill="none" stroke="#00BB65" stroke-width="1.3" stroke-linecap="round"/></symbol>
</svg>

<section class="sheet">
  <img class="bg" src="../public/images/positioning.jpg" alt="">
  <div class="veil"></div>
  <div class="disc"></div>
  <div class="glow" style="right:-30mm;top:96mm;width:84mm;height:84mm;background:radial-gradient(circle,var(--magenta-soft),transparent 70%)"></div>

  <div class="eyebrow">A Social Wellness Space</div>

  <div class="orbit">
    <div class="halo"></div>
    <svg class="rings" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="43" class="ring" stroke-dasharray="14 3 1 3"/>
      <circle cx="50" cy="50" r="31" class="ring" stroke-dasharray="0.6 1.6"/>
      <circle cx="50" cy="50" r="49" class="ring" stroke-dasharray="0.4 2.4" opacity=".35"/>
    </svg>
    <img class="logo" src="../public/images/logo.png" alt="Project Soulfulness">
    <!-- the ten services as icons on the ring -->
    <span class="dot m" style="--a:-90deg"><svg viewBox="0 0 24 24"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg></span>
    <span class="dot"   style="--a:-54deg"><svg viewBox="0 0 24 24"><path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.530 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/></svg></span>
    <span class="dot m" style="--a:-18deg"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg></span>
    <span class="dot"   style="--a:18deg"><svg viewBox="0 0 24 24"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg></span>
    <span class="dot m" style="--a:54deg"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
    <span class="dot"   style="--a:90deg"><svg viewBox="0 0 24 24"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></svg></span>
    <span class="dot m" style="--a:126deg"><svg viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></span>
    <span class="dot"   style="--a:162deg"><svg viewBox="0 0 24 24"><path d="M7 21h10"/><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/><path d="M11.38 12a2.4 2.4 0 0 1-.4-4.77 2.4 2.4 0 0 1 3.2-2.77 2.4 2.4 0 0 1 3.47-.63 2.4 2.4 0 0 1 3.37 3.37 2.4 2.4 0 0 1-1.1 3.7 2.51 2.51 0 0 1 .03 1.1"/><path d="m13 12 4-4"/><path d="M10.9 7.25A3.990 3.990 0 0 0 4 10c0 .73.2 1.41.54 2"/></svg></span>
    <span class="dot m" style="--a:198deg"><svg viewBox="0 0 24 24"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></svg></span>
    <span class="dot"   style="--a:234deg"><svg viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg></span>
  </div>
  <svg class="bfly" style="left:14mm;top:24mm;transform:rotate(-14deg)"><use href="#b"/></svg>
  <svg class="bfly" style="right:13mm;top:100mm;transform:rotate(12deg)"><use href="#bg"/></svg>

  <div class="copy">
    <div class="pre">Something soulful is</div>
    <div class="soon">Coming Soon</div>
    <div class="tag">More than a café — <b>a community for a calmer you.</b></div>
  </div>

  <div class="qrcard">
    <div class="txt">
      <div class="q">Want more details or<br>to <span>register?</span></div>
      <div class="hand">Scan the QR code
        <svg viewBox="0 0 44 20" fill="none" stroke="#C32991" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c10-8 24-9 38-2"/><path d="M33 4l7 6-8 4"/></svg>
      </div>
    </div>
    <div class="qrbox"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="foot">
    <svg viewBox="0 0 560 90" preserveAspectRatio="none"><path d="M0,30 C120,0 240,6 320,24 C420,46 490,40 560,12 L560,90 L0,90 Z" fill="#00BB65"/><path d="M0,30 C120,0 240,6 320,24 C420,46 490,40 560,12" fill="none" stroke="#C32991" stroke-width="3"/></svg>
    <p>Good People. Better Days.</p>
  </div>
</section>
</body>
</html>
